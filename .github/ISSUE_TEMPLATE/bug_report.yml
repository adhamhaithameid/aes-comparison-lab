name: Bug Report
description: Report a bug in the AES implementation, tests, benchmarks, or web platform
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: "The AES visualizer shows incorrect state after round 3..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to the visualizer page
        2. Enter key 2b7e151628aed2a6abf7158809cf4f3c
        3. Click "Next" 3 times
        4. Observe incorrect state
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - C++ AES implementation
        - OpenSSL wrapper
        - Test suite
        - Benchmarks
        - Web platform
        - Documentation
        - CI/CD
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 14.5, Ubuntu 22.04, Windows 11..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: Git commit hash or version tag
      placeholder: "v1.0.0 or abc1234"
